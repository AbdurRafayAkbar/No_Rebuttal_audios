[project]
name = "nra"
version = "0.1.0"
description = "Finds calls where a customer asked a question and the voice bot did not answer it."
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nra = "nra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nra = ["web_page.html"]
